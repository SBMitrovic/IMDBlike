<!-- Watch Later Section -->
<section class="movies-section">
  <div class="movies-container">
    <!-- Header -->
    <div class="movies-header">
      <h1>Watch Later</h1>
      <p class="subtitle">Movies saved for later viewing</p>
    </div>

    <!-- Movies Grid -->
    <div class="movies-grid" *ngIf="watchLater && watchLater.length > 0 && !loader">
      <div class="movie-card" *ngFor="let movie of watchLater" (click)="openMovieModal(movie)">
        <div class="movie-card-image">
          <img 
            [src]="movie.poster_path ? 'https://image.tmdb.org/t/p/w342' + movie.poster_path : 'assets/placeholder-poster.jpg'" 
            [alt]="movie.title"
            loading="lazy">
          
          <div class="movie-overlay">
            <div class="movie-overlay-content">
              <span class="watch-now">See More</span>
              <i class="fas fa-info-circle"></i>
            </div>
          </div>
        </div>
        
        <div class="movie-card-content">
          <h3 class="movie-title">{{movie.title}}</h3>
          <div class="movie-meta">
            <span class="release-year">{{movie.release_date | date:'yyyy'}}</span>
            <div class="rating">
              <i class="fas fa-star"></i>
              <span>{{movie.vote_average | number:'1.1-1'}}</span>
            </div>
          </div>
          <div class="movie-actions">
            <button [class]="isInFavorites(movie.id) ? 'btn-favorite active' : 'btn-favorite'" 
                    type="button" aria-label="Toggle favorites" 
                    (click)="toggleFavorite(movie, $event)">
              <i [class]="isInFavorites(movie.id) ? 'fas fa-heart' : 'far fa-heart'"></i>
            </button>
            <button class="btn-watchlist active" type="button" aria-label="Remove from watch later" 
                    (click)="removeFromWatchLater(movie, $event)">
              <i class="fas fa-bookmark"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="watchLater && watchLater.length === 0 && !loader">
      <div class="empty-content">
        <i class="far fa-bookmark"></i>
        <h3>No Movies in Watch Later</h3>
        <p>Add movies to your watch later list to see them here!</p>
        <a routerLink="/movies" class="btn btn-primary">Browse Movies</a>
      </div>
    </div>

    <!-- Loading State -->
    <div class="loading-state" *ngIf="loader">
      <div class="loading-spinner">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Loading your watch later list...</p>
      </div>
    </div>
  </div>
</section>
