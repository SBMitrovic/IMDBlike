
<div class="container">
      <div class="logo">
         <a href="https://github.com/">IMDBLike</a>
        </div>

      <div class="links">
        <a href="/home">Home</a>
        <a href="/about">About</a>
        <a href="/movies">Top rated movies</a>
      </div>  
      
      <div class="search">
        <input type="text" placeholder="Search IMDBLike" name="search">
      </div>

      <div class="toogle-genre">
        <select class="genre" name="browseByGenre" (change)="this.genreComponent.onGenreChange($event)">
          <option disabled selected>Browse by genre</option>
          <option *ngFor="let genre of genresArr" [value]="genre.id">
            {{ genre.name }}
          </option>
        </select>
      </div>

</div>
