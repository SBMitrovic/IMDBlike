
<div class="container">
      <div class="logo">
         <a routerLink="/home">IMDBLike</a>
        </div>

      <div class="links">
        <a routerLink="/home" routerLinkActive="active">Home</a>
        
        <!-- Show different links based on authentication status -->
        <ng-container *ngIf="currentUser; else notLoggedIn">
          <!-- User is logged in -->
          <span class="user-info">Welcome, {{currentUser.displayName || currentUser.email}}</span>
          <a (click)="logout()" style="cursor: pointer;" class="logout-btn">Logout</a>
        </ng-container>
        
        <ng-template #notLoggedIn>
          <!-- User is not logged in -->
          <a routerLink="/login" routerLinkActive="active">Login</a>
          <a routerLink="/register" routerLinkActive="active">Register</a>
        </ng-template>
        
        <a routerLink="/movies" routerLinkActive="active">Top rated movies</a>
      </div>  
      
      <div class="search">
        <div class="search-container">
          <input 
            type="text" 
            placeholder="Search IMDBLike" 
            name="search"
            [(ngModel)]="searchQuery"
            (keypress)="onSearchKeyPress($event)"
            class="search-input">
          <button 
            type="button" 
            class="search-btn" 
            (click)="onSearch()"
            [disabled]="!searchQuery.trim()">
            <i class="fas fa-search"></i>
          </button>
        </div>
      </div>

      <div class="toggle-genre">
        <select class="genre" name="browseByGenre" (change)="this.genreComponent.onGenreChange($event)">
          <option disabled selected>Browse by genre</option>
          <option *ngFor="let genre of genresArr" [value]="genre.id">
            {{ genre.name }}
          </option>
        </select>
      </div>

</div>
