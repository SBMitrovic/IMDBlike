<!-- Favorites Section -->
<section class="movies-section">
  <div class="movies-container">
    <!-- Header -->
    <div class="movies-header">
      <h1>My Favorites</h1>
      <p class="subtitle">Your favorite movies collection</p>
    </div>

    <!-- Movies Grid -->
    <div class="movies-grid" *ngIf="favorites && favorites.length > 0 && !loader">
      <div class="movie-card" *ngFor="let movie of favorites" (click)="openMovieModal(movie)">
        <div class="movie-card-image">
          <img 
            [src]="movie.poster_path ? 'https://image.tmdb.org/t/p/w342' + movie.poster_path : 'assets/placeholder-poster.jpg'" 
            [alt]="movie.title"
            loading="lazy">
          
          <div class="movie-overlay">
            <div class="movie-overlay-content">
              <span class="watch-now">See More</span>
              <i class="fas fa-info-circle"></i>
            </div>
          </div>
        </div>
        
        <div class="movie-card-content">
          <h3 class="movie-title">{{movie.title}}</h3>
          <div class="movie-meta">
            <span class="release-year">{{movie.release_date | date:'yyyy'}}</span>
            <div class="rating">
              <i class="fas fa-star"></i>
              <span>{{movie.vote_average | number:'1.1-1'}}</span>
            </div>
          </div>
          <div class="movie-actions">
            <button class="btn-favorite active" type="button" aria-label="Remove from favorites" 
                    (click)="removeFromFavorites(movie, $event)">
              <i class="fas fa-heart"></i>
            </button>
            <button [class]="isInWatchLater(movie.id) ? 'btn-watchlist active' : 'btn-watchlist'" 
                    type="button" aria-label="Toggle watchlist" 
                    (click)="toggleWatchLater(movie, $event)">
              <i [class]="isInWatchLater(movie.id) ? 'fas fa-bookmark' : 'far fa-bookmark'"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="favorites && favorites.length === 0 && !loader">
      <div class="empty-content">
        <i class="far fa-heart"></i>
        <h3>No Favorites Yet</h3>
        <p>Start adding movies to your favorites to see them here!</p>
        <a routerLink="/movies" class="btn btn-primary">Browse Movies</a>
      </div>
    </div>

    <!-- Loading State -->
    <div class="loading-state" *ngIf="loader">
      <div class="loading-spinner">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Loading your favorites...</p>
      </div>
    </div>
  </div>
</section>
